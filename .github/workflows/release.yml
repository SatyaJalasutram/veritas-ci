# A release vX.Y.Z: tests that commit, checks the tag matches the CLI's
# version, publishes a GitHub release for it (unless one was already
# published), and moves the major tag (v0 for 0.x) to it, so `@v0` always
# means the latest 0.x release.
#
# Releases are immutable (owner, 22 Oct night): once published, a release's
# assets can't change. So KEYS.md is attached as the release is created, in
# the same call, and never uploaded to or replaced on an existing release.
# Release by pushing the tag (`git tag v0.1.0 && git push origin v0.1.0`).
# A release published by hand on GitHub has no KEYS.md and can't be given
# one: the job says so and fails, rather than leave it silently without.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: The tag is a version, vX.Y.Z
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
      - run: pip install pyyaml  # test_action.py reads action.yml; the CLI itself needs nothing
      - run: python -m unittest discover -s tests -v
      - name: The tag matches the CLI's version
        run: |
          version="$(python3 -c 'import veritas_ci; print(veritas_ci.__version__)')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME but veritas_ci.__version__ is $version"; exit 1; }
      # The evidence signing keys' fingerprints (KEYS.md) go out with every
      # release, attached as it is created, so a reader can pin a key outside
      # Veritas (docs/verify-a-report.md in the Veritas repository).
      # tests/test_keys.py checked its format above.
      - name: Publish the release, with KEYS.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME is already published."
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx KEYS.md \
              || { echo "::error::release $GITHUB_REF_NAME has no KEYS.md, and an immutable release can't be given one. Release by pushing the tag."; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" KEYS.md --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
