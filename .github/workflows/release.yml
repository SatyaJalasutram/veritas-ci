# A release vX.Y.Z: tests that commit, checks the tag matches the CLI's
# version, publishes a GitHub release for it (unless one was already
# published), and moves the major tag (v0 for 0.x) to it, so `@v0` always
# means the latest 0.x release.
#
# Either way of releasing works: push the tag (`git tag v0.1.0 && git push
# origin v0.1.0`), or publish a release on GitHub with a new tag. The second
# fires both events below, so every step is safe to run twice.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: The tag is a version, vX.Y.Z
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
      - run: pip install pyyaml  # test_action.py reads action.yml; the CLI itself needs nothing
      - run: python -m unittest discover -s tests -v
      - name: The tag matches the CLI's version
        run: |
          version="$(python3 -c 'import veritas_ci; print(veritas_ci.__version__)')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME but veritas_ci.__version__ is $version"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME is already published."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
