# The CLI and the Action's shell, tested on every push and pull request.
name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Pinned, not ubuntu-latest: that label moved to Ubuntu 26.04 on 19 Oct
    # 2026, which has no Python 3.9 build for actions/setup-python (found
    # 29 Oct, PR #7: "The version '3.9' ... was not found for Ubuntu
    # 26.04"). Ubuntu 24.04 still has it; the Veritas image itself pins the
    # same way ("ship what you test").
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pyyaml  # test_action.py reads action.yml; the CLI itself needs nothing
      - run: python -m unittest discover -s tests -v
